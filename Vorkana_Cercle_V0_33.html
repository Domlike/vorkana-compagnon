<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183428">
  <title>Vorkana — Vie de campagne</title>
  <style>
    :root{--bg:#101b17;--panel:#17261f;--panel2:#1d3027;--line:#3e5b4d;--ink:#f1eadc;--muted:#b8c6bc;--gold:#d6b56f;--green:#70b884;--green2:#274d35;--amber:#d2a85a;--red:#d9796f;--blue:#7fb0d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#294b3a,#101b17 58%,#0b1210);color:var(--ink);font:15px/1.5 Segoe UI,Arial,sans-serif}.shell{width:min(1220px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:22px;border:1px solid var(--line);border-radius:16px;background:#13221bbf;box-shadow:0 18px 55px #0007}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-size:11px;font-weight:800}h1{margin:5px 0 6px;font:700 clamp(32px,5vw,58px)/1 Georgia}h2,h3,h4{font-family:Georgia;margin-top:0}.lead,.muted{color:var(--muted)}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap}.status i{width:10px;height:10px;border-radius:50%;background:var(--amber)}.status.online i{background:var(--green);box-shadow:0 0 10px var(--green)}.identity-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:14px 0;color:var(--muted)}.identity-bar select{border:1px solid var(--line);background:#0f1b16;color:var(--ink);border-radius:7px;padding:8px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn,.tabs button{border:1px solid var(--line);background:#20362b;color:var(--ink);border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}.btn:hover,.tabs button:hover,.tabs button.active{border-color:var(--green);background:#294a37}.btn.primary{background:#356a47;border-color:#5ca773;font-weight:700}.btn.danger{border-color:#8b504a;color:#ffd6d2}.btn.small{padding:5px 8px;font-size:12px}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:17px;box-shadow:0 10px 28px #0004}.card.green{background:linear-gradient(135deg,#234431,#17261f)}.metric{padding:15px;border:1px solid #476b59;background:#1d3228;border-radius:10px}.metric small,.metric span{display:block;color:var(--muted)}.metric b{display:block;font:700 22px Georgia;color:#e9d69f;margin:4px 0}.timeline{border-left:2px solid #537461;margin-left:8px;padding-left:20px}.timeline article{position:relative;margin:0 0 16px}.timeline article:before{content:"";position:absolute;left:-27px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}.tag,.state{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px}.state.available{background:#224a32;border-color:#5b9d70;color:#d9f6e1}.state.limited{background:#4b3b1d;border-color:#9b7a3c;color:#ffe5ae}.state.unavailable{background:#4a2724;border-color:#92534e;color:#ffd4ce}.state.unknown{background:#303b36;color:#d2ddd6}.filters,.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-weight:700;font-size:12px;color:#d9cda9}.field input,.field select,.field textarea{width:100%;border:1px solid #52705f;border-radius:7px;padding:9px;background:#0f1b16;color:var(--ink);font:inherit}.field textarea{min-height:80px;resize:vertical}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;border-bottom:1px solid #354d41;padding:9px;vertical-align:top}th{color:#d6c69d;font-size:12px}.proposal{display:flex;justify-content:space-between;gap:12px;padding:11px;border:1px solid #3c594a;border-radius:9px;background:#1b2d24;margin-top:8px}.proposal.accepted{border-color:#5d9b6d;background:#224431}.proposal.rejected{border-color:#8b504a;background:#3e2522}.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.notice{padding:11px 13px;border-left:4px solid var(--gold);background:#312c20;border-radius:7px;color:#e9ddbf}.notice.green{border-color:var(--green);background:#1c3928}.resource{display:grid;gap:7px}.resource h3{margin:0}.resource a{color:#a9d1ef}.empty{color:var(--muted);font-style:italic}@media(max-width:850px){.top{display:block}.status{margin-top:12px;width:max-content}.identity-bar{justify-content:flex-start}.grid.two,.grid.three,.filters,.form{grid-template-columns:1fr}.field.wide{grid-column:auto}.proposal{display:block}.actions{margin-top:9px}.shell{padding:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><span class="eyebrow">Vorkana • espace partagé</span><h1>Vie de campagne</h1><p class="lead">Mémoire du groupe, connaissances partagées et préparatifs entre les séances.</p></div><div class="status" id="syncStatus"><i></i><span>Connexion…</span></div></header>
    <div class="identity-bar" id="identityBar"><label for="hubPlayer">Je suis</label><select id="hubPlayer"></select></div>
    <nav class="tabs" id="tabs"><button data-view="market" class="active">Biens & services</button><button data-view="resources">Ressources</button><button data-view="calendar">Calendrier</button><button data-view="availability" id="availabilityTab" hidden>Disponibilités MJ</button></nav>
    <section class="view" id="view-resources"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view active" id="view-market"></section>
    <section class="view" id="view-availability"></section>
  </main>
  <script src="earthdawn-realtime-config.js"></script>
  <script src="earthdawn-sync.js?v=0.35.0"></script>
  <script src="vorkana-campagne.js?v=0.35.0"></script>
  <script>
  (function(){
    "use strict";
    const params=new URLSearchParams(location.search), role=params.get("role")==="gm"?"gm":"player", playerId=params.get("player")||"pj_0";
    const NAMES={pj_0:"Zra’Ul",pj_1:"Kalha",pj_2:"Kal’Zakath",pj_3:"Barbak",pj_4:"Ogunta",pj_5:"Jaskar",pj_6:"Gul’Rak"};
    const Sync=window.EarthdawnSync, room=()=>Sync.status().room, key=()=>`vorkana_circle_${room()}_v033`;
    const MARKET_REVISION="keltanap-10-riag";
    const CATALOG=[
      {id:"rations",name:"Rations de voyage",category:"Voyage",status:"available",stock:10,price:"1 PA / semaine",note:"Vivres simples disponibles au village, dans la limite des réserves locales."},
      {id:"torches",name:"Torches et huile",category:"Voyage",status:"available",stock:8,price:"À confirmer",note:"Matériel courant disponible à Keltanap."},
      {id:"rope",name:"Corde",category:"Voyage",status:"limited",stock:2,price:"À confirmer",note:"Peu de pièces prêtes à la vente ; longueur à préciser avant achat."},
      {id:"arrows",name:"Flèches ordinaires",category:"Projectiles",status:"limited",stock:15,price:"À confirmer",note:"Petit stock local destiné surtout à la chasse."},
      {id:"healing",name:"Applications de kit de soigneur",category:"Soins",status:"limited",stock:3,price:"À confirmer",note:"Quelques fournitures seulement ; disponibilité à confirmer à l’arrivée."},
      {id:"silvermoss",name:"Mousse d’argent",category:"Soins",status:"unavailable",stock:0,price:"—",note:"Aucune source de vente confirmée à l’instant présent."},
      {id:"weapons",name:"Armes courantes",category:"Armement",status:"limited",stock:null,price:"Selon arme",note:"Quelques outils ou armes simples ; toute pièce particulière demande un délai."},
      {id:"armor",name:"Armures courantes",category:"Armement",status:"unavailable",stock:0,price:"Selon armure",note:"Aucune armure prête à la vente n’est confirmée dans ce village."},
      {id:"repairs",name:"Réparation / entretien",category:"Service",status:"limited",stock:null,price:"Selon travail",note:"Travaux simples possibles selon l’artisan et le temps disponible."},
      {id:"lodging",name:"Repas et couchage simples",category:"Service",status:"available",stock:null,price:"À confirmer",note:"Accueil villageois modeste ; capacité limitée pour un groupe nombreux."}
    ];
    const fresh=()=>({revision:MARKET_REVISION,context:{date:"Vers le 10 Riag 1448 TH",location:"Keltanap — village d’environ 300 habitants",note:"Prochaine occasion d’achat prévue à l’arrivée à Keltanap."},catalog:JSON.parse(JSON.stringify(CATALOG)),proposals:[]});
    function load(){try{const saved=JSON.parse(localStorage.getItem(key())||"null");if(saved&&saved.revision===MARKET_REVISION&&saved.catalog)return saved;const next=fresh();if(saved&&Array.isArray(saved.proposals))next.proposals=saved.proposals;return next}catch(_){return fresh()}}
    let state=load();
    const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const id=()=>`market-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    function save(){if(role==='gm')return;try{localStorage.setItem(key(),JSON.stringify(state))}catch(_){}}
    function publicState(){return {context:state.context,catalog:state.catalog,updatedAt:new Date().toISOString()}}
    let availabilityRevision=0,availabilityDirty=false;
    function broadcast(){if(role==='gm'){VorkanaCampaign.publish(state.context,state.catalog,availabilityRevision);availabilityDirty=false;document.getElementById('syncStatus').querySelector('span').textContent='Publication transmise au cockpit…';}}
    function stateLabel(value){return {available:"Disponible",limited:"Limité / sur commande",unavailable:"Indisponible",unknown:"À déterminer"}[value]||value}
    function renderResources(){
      document.getElementById("view-resources").innerHTML=`<div class="grid three"><div class="metric"><small>Date prévue du marché</small><b>${esc(state.context.date)}</b><span>prévision, non avancement de la campagne</span></div><div class="metric"><small>Prochain marché</small><b>${esc(state.context.location)}</b><span>source du marché</span></div><div class="metric"><small>Groupe</small><b>Vorkana</b><span>sept Adeptes connectables</span></div></div>
      <div class="grid two" style="margin-top:14px"><article class="card green resource"><span class="tag">Chronique publique</span><h3>De Grand-Foire à Rocnoir</h3><p>Le groupe a rejoint Rocnoir après une semaine de voyage, enquêté sur la disparition de Katsika, puis l’a libéré sur l’île des Naufrageurs sans déclencher d’alarme ni de combat.</p></article>
      <article class="card resource"><span class="tag">Chanson</span><h3>Le Fleuve garde les Noms</h3><p>Zra’Ul et Jaskar l’ont mémorisée pendant le voyage. Son texte complet n’est pas encore consolidé dans les fichiers maîtres : la ressource est donc signalée sans inventer de paroles.</p></article>
      <article class="card resource"><span class="tag">Documentation</span><h3>Règles et décisions de table</h3><p>Les jets proposés par les dossiers utilisent les niveaux et dés consolidés. Les cas inhabituels et les effets de situation restent soumis à l’arbitrage du MJ.</p></article>
      <article class="card resource"><span class="tag">Mémoire</span><h3>Vorkana a fait justice</h3><p>Après le sauvetage de Katsika, Kal’Zakath a revendiqué publiquement l’action au nom de Vorkana. Sa signification reste ouverte : justice, libération, bravade, menace ou récit selon celui qui la rapporte.</p></article></div>
      <div class="notice" style="margin-top:14px">Seules les connaissances des personnages ont leur place ici. Les secrets et préparations du MJ restent dans le cockpit.</div><details class="card" style="margin-top:14px"><summary>Les prochaines rubriques</summary><p><b>Mémoire du groupe :</b> histoires jouées, lieux visités, PNJ connus.</p><p><b>Connaissances :</b> peuples, histoire, géographie et Passions, selon ce que les personnages en savent.</p><p><b>Agora :</b> échanges entre les séances, interludes et rappel de leur fonctionnement.</p><p><b>Aides de jeu :</b> objets à trame, vision astrale et règles utiles.</p><p class="muted">Ces rubriques seront alimentées avec des textes validés. Leur contenu n’est pas encore publié.</p></details>`;
    }
    function renderCalendar(){
      const events=[["18 Sollus 1448","Voyage vers Throal, rencontre avec Voluptia, entrée contrôlée et premiers échanges avec la Grande Bibliothèque."],["19–20 Sollus","Deux jours à Grand-Foire : préparatifs personnels, harmonisation des chiens et apprentissages joués."],["21–28 Sollus","Voyage d’environ une semaine ; arrivée à Rocnoir le 28 au soir."],["29 Sollus","Enquête auprès de Nicodémus et M’rok, Capitainerie, plage des Coques et localisation de Katsika."],["Nuit du 29 au 30","Reconnaissance de l’île des Naufrageurs, libération et exfiltration de Katsika sans alarme ni combat."],["30 Sollus","Peu après l’aube, après le retour de Katsika."],["Vers le 10 Riag 1448",state.context.note||"Arrivée prévue à Keltanap."]];
      document.getElementById("view-calendar").innerHTML=`<article class="card"><h2>Calendrier public de campagne</h2><div class="timeline">${events.map(([date,text])=>`<article><b>${esc(date)}</b><p>${esc(text)}</p></article>`).join("")}</div></article>`;
    }
    function catalogRows(items){return items.map(item=>`<tr><td><b>${esc(item.name)}</b><br><small class="muted">${esc(item.category)}</small></td><td><span class="state ${esc(item.status)}">${esc(stateLabel(item.status))}</span></td><td>${Number.isFinite(Number(item.stock))&&item.stock!==null?esc(item.stock):"—"}</td><td>${esc(item.price||"—")}</td><td>${esc(item.note||"—")}</td></tr>`).join("")}
    function renderMarket(){
      const mine=state.proposals.filter(p=>p.playerId===playerId), options=state.catalog.map(item=>`<option value="${esc(item.id)}">${esc(item.name)} — ${esc(stateLabel(item.status))}</option>`).join("");
      document.getElementById("view-market").innerHTML=`<div class="grid three"><div class="metric"><small>Marché de référence</small><b>${esc(state.context.location)}</b><span>${esc(state.context.date)}</span></div><div class="metric"><small>Offres disponibles</small><b>${state.catalog.filter(x=>x.status==="available").length}</b><span>plus ${state.catalog.filter(x=>x.status==="limited").length} limitées</span></div><div class="metric"><small>Mes propositions</small><b>${mine.length}</b><span>achat ou vente</span></div></div>
      <article class="card" style="margin-top:14px"><div class="filters"><div class="field"><label>Rechercher</label><input id="marketSearch" placeholder="Objet ou service"></div><div class="field"><label>Catégorie</label><select id="marketCategory"><option value="">Toutes</option>${[...new Set(state.catalog.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join("")}</select></div></div><div class="table-wrap"><table><thead><tr><th>Offre</th><th>Disponibilité</th><th>Stock</th><th>Prix</th><th>Précision</th></tr></thead><tbody id="marketRows">${catalogRows(state.catalog)}</tbody></table></div></article>
      ${role==="player"?`<div class="grid two" style="margin-top:14px"><article class="card"><h3>Proposer un achat ou une vente</h3><div class="form"><div class="field"><label>Opération</label><select id="proposalKind"><option>Achat</option><option>Vente</option></select></div><div class="field"><label>Objet du catalogue</label><select id="proposalItem"><option value="custom">Autre / offre personnelle</option>${options}</select></div><div class="field"><label>Quantité</label><input id="proposalQty" type="number" min="1" value="1"></div><div class="field"><label>Prix proposé</label><input id="proposalPrice" placeholder="Facultatif"></div><div class="field wide"><label>Détail</label><textarea id="proposalNote" placeholder="Objet exact, état, délai, échange proposé…"></textarea></div></div><button class="btn primary" id="sendProposal">Transmettre au MJ</button><p class="muted">La proposition ne modifie ni votre argent ni votre inventaire avant validation.</p></article><article class="card"><h3>Suivi de mes propositions</h3><div id="myProposals">${mine.length?mine.slice().reverse().map(proposalCard).join(""):"<p class='empty'>Aucune proposition.</p>"}</div></article></div>`:`<article class="card" style="margin-top:14px"><h3>Propositions reçues</h3>${state.proposals.length?state.proposals.slice().reverse().map(proposalCard).join(""):"<p class='empty'>Aucune proposition reçue.</p>"}</article>`}`;
      const filter=()=>{const q=(document.getElementById("marketSearch").value||"").toLowerCase(),cat=document.getElementById("marketCategory").value;document.getElementById("marketRows").innerHTML=catalogRows(state.catalog.filter(x=>(!cat||x.category===cat)&&(!q||`${x.name} ${x.note}`.toLowerCase().includes(q))))};
      document.getElementById("marketSearch").oninput=filter;document.getElementById("marketCategory").onchange=filter;
      if(role==="player")document.getElementById("sendProposal").onclick=sendProposal;
      document.querySelectorAll("[data-decision]").forEach(button=>button.onclick=()=>decideProposal(button.dataset.proposal,button.dataset.decision));
    }
    function proposalCard(p){const item=state.catalog.find(x=>x.id===p.itemId),status=p.status||"pending",labels={pending:"En attente",received:"Reçue par le MJ",accepted:"Acceptée",rejected:"Refusée"};return `<div class="proposal ${esc(status)}"><div><b>${esc(p.kind)} — ${esc(item?.name||p.itemName||"Offre libre")}</b><br><small>${esc(p.playerName)} • quantité ${p.quantity}${p.price?` • ${esc(p.price)}`:""}</small>${p.note?`<p>${esc(p.note)}</p>`:""}<span class="state ${status==="accepted"?"available":status==="rejected"?"unavailable":"limited"}">${esc(labels[status]||status)}</span></div>${role==="gm"&&status!=="accepted"&&status!=="rejected"?`<div class="actions"><button class="btn primary small" data-decision="accepted" data-proposal="${esc(p.id)}">Accepter</button><button class="btn danger small" data-decision="rejected" data-proposal="${esc(p.id)}">Refuser</button></div>`:""}</div>`}
    function sendProposal(){const itemId=document.getElementById("proposalItem").value,item=state.catalog.find(x=>x.id===itemId),proposal={id:id(),playerId,playerName:NAMES[playerId]||playerId,kind:document.getElementById("proposalKind").value,itemId:item?.id||"",itemName:item?.name||"Offre libre",quantity:Math.max(1,Number(document.getElementById("proposalQty").value)||1),price:document.getElementById("proposalPrice").value.trim(),note:document.getElementById("proposalNote").value.trim(),status:"pending",sentAt:new Date().toISOString()};state.proposals.push(proposal);save();Sync.sendToGM({type:"vorkana-market-proposal",proposal});renderMarket()}
    function decideProposal(proposalId,decision){if(role!=="gm")return;VorkanaCampaign.decide(proposalId,decision);document.getElementById('syncStatus').querySelector('span').textContent='Décision transmise au cockpit…';}
    function renderAvailability(){
      if(availabilityDirty)return;availabilityRevision=state.revisionNumber||0;
      if(role!=="gm")return;document.getElementById("view-availability").innerHTML=`<div class="grid two"><article class="card"><h3>Contexte de disponibilité</h3><div class="form"><div class="field"><label>Date</label><input id="contextDate" value="${esc(state.context.date)}"></div><div class="field"><label>Lieu</label><input id="contextLocation" value="${esc(state.context.location)}"></div><div class="field wide"><label>Note publique</label><textarea id="contextNote">${esc(state.context.note||"")}</textarea></div></div><button class="btn primary" id="saveContext">Publier le contexte</button></article><article class="card green"><h3>Principe</h3><p>Le MJ reste la source de vérité. Les joueurs voient la dernière disponibilité publiée ; une proposition acceptée peut décrémenter automatiquement un stock chiffré.</p><p>Une disponibilité « limitée » signifie commande, délai, marchand spécialisé ou quantité incertaine.</p></article></div><article class="card" style="margin-top:14px"><h3>Catalogue à l’instant T</h3><div class="table-wrap"><table><thead><tr><th>Offre</th><th>État</th><th>Stock</th><th>Prix</th><th>Note</th></tr></thead><tbody>${state.catalog.map(item=>`<tr><td><b>${esc(item.name)}</b><br><small>${esc(item.category)}</small></td><td><select data-catalog-status="${esc(item.id)}"><option value="available" ${item.status==="available"?"selected":""}>Disponible</option><option value="limited" ${item.status==="limited"?"selected":""}>Limité</option><option value="unavailable" ${item.status==="unavailable"?"selected":""}>Indisponible</option><option value="unknown" ${item.status==="unknown"?"selected":""}>À déterminer</option></select></td><td><input style="width:90px" type="number" min="0" data-catalog-stock="${esc(item.id)}" value="${item.stock===null?"":esc(item.stock)}" placeholder="—"></td><td><input data-catalog-price="${esc(item.id)}" value="${esc(item.price||"")}"></td><td><input data-catalog-note="${esc(item.id)}" value="${esc(item.note||"")}"></td></tr>`).join("")}</tbody></table></div><button class="btn primary" id="publishCatalog">Publier les disponibilités</button></article>`;
      document.getElementById("saveContext").onclick=()=>{state.context={date:document.getElementById("contextDate").value.trim(),location:document.getElementById("contextLocation").value.trim(),note:document.getElementById("contextNote").value.trim()};save();broadcast();renderAll()};
      document.getElementById("publishCatalog").onclick=()=>{state.catalog.forEach(item=>{item.status=document.querySelector(`[data-catalog-status="${item.id}"]`).value;const raw=document.querySelector(`[data-catalog-stock="${item.id}"]`).value;item.stock=raw===""?null:Math.max(0,Number(raw));item.price=document.querySelector(`[data-catalog-price="${item.id}"]`).value.trim();item.note=document.querySelector(`[data-catalog-note="${item.id}"]`).value.trim()});save();broadcast();renderAll()};
    }
    function renderAll(){renderResources();renderCalendar();renderMarket();renderAvailability()}
    document.querySelectorAll("[data-view]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===`view-${button.dataset.view}`))});
    if(role==="gm"){document.getElementById("availabilityTab").hidden=false;document.getElementById("identityBar").hidden=true}else{const selector=document.getElementById("hubPlayer");selector.innerHTML=Object.entries(NAMES).map(([id,name])=>`<option value="${id}" ${id===playerId?"selected":""}>${esc(name)}</option>`).join("");selector.onchange=()=>{const url=new URL(location.href);url.searchParams.set("player",selector.value);location.href=url.href}}
    Sync.configure({role,playerId:role==="player"?playerId:"",name:role==="gm"?"MJ":NAMES[playerId]||playerId}).start();
    if(role==='gm'){
      VorkanaCampaign.start(false);state=JSON.parse(JSON.stringify(VorkanaCampaign.state()));
      document.getElementById('view-availability').addEventListener('input',()=>{availabilityDirty=true;});
      addEventListener('vorkana-campaign-changed',()=>{state=JSON.parse(JSON.stringify(VorkanaCampaign.state()));renderAll();document.getElementById('syncStatus').querySelector('span').textContent='Disponibilités confirmées par le cockpit';});
      addEventListener('vorkana-campaign-error',event=>{
        const el=document.getElementById('syncStatus');el.classList.remove('online');el.querySelector('span').textContent=event.detail.message;
        if(!document.getElementById('reloadAvailability')){const b=document.createElement('button');b.id='reloadAvailability';b.className='btn small';b.textContent='Recharger les disponibilités confirmées';b.onclick=()=>{if(availabilityDirty&&!confirm('Recharger sans conserver les modifications de disponibilité en cours ?'))return;availabilityDirty=false;state=JSON.parse(JSON.stringify(VorkanaCampaign.state()));renderAll();b.remove();};el.after(b);}
      });
    }
    addEventListener('earthdawn-sync-status',event=>{const el=document.getElementById('syncStatus'),online=event.detail.status==='online';el.classList.toggle('online',online);el.querySelector('span').textContent=`${online?'En ligne':'Mode local'} • salle ${event.detail.room}`;if(online){if(role==='gm')Sync.sendToGM({type:'vorkana-hub-request',asGM:true});else{Sync.sendToGM({type:'vorkana-hub-request',playerId});state.proposals.filter(p=>p.status==='pending').forEach(proposal=>Sync.sendToGM({type:'vorkana-market-proposal',proposal}));}}});
    addEventListener('earthdawn-sync-message',event=>{if(role==='gm')return;const d=event.detail.payload||{};if(d.type==='vorkana-hub-state'&&d.state){if(Number(d.state.revisionNumber||0)<Number(state.revisionNumber||0))return;state.context=d.state.context||state.context;state.catalog=Array.isArray(d.state.catalog)?d.state.catalog:state.catalog;state.revisionNumber=d.state.revisionNumber||0;save();state.proposals.filter(p=>p.status==='pending').forEach(proposal=>Sync.sendToGM({type:'vorkana-market-proposal',proposal}));renderAll();}else if(d.type==='vorkana-market-decision'){const p=state.proposals.find(x=>x.id===d.proposalId);if(p&&!(['accepted','rejected'].includes(p.status)&&d.status==='received')){p.status=d.status;p.decidedAt=d.decidedAt||new Date().toISOString();save();renderMarket();}}});
    renderAll();
  })();
  </script>
</body>
</html>
